<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="tbGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#7c3aed" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Squircle Base with Rich Developer Gradient -->
  <rect x="2" y="2" width="60" height="60" rx="16" ry="16" fill="url(#tbGradient)" filter="url(#subtleGlow)" />
  
  <!-- Subtle High-tech Inner Ring -->
  <rect x="3" y="3" width="58" height="58" rx="15" ry="15" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="1.5" />

  <!-- Monogram TB -->
  <text 
    x="31" 
    y="40" 
    text-anchor="middle" 
    fill="#ffffff" 
    font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif" 
    font-size="25" 
    font-weight="800" 
    letter-spacing="-0.5px"
    style="user-select:none;"
  >TB</text>

  <!-- Live/Active Status Indicator Badge -->
  <circle cx="51" cy="51" r="5" fill="#10b981" stroke="#0f172a" stroke-width="2" />
</svg>